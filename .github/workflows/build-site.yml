name: Build site

on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Put the built site in the repo root
        run: |
          rm -rf assets
          mkdir assets
          cp -r site/dist/assets/. assets/
          cp site/dist/index.html index.html
          touch .nojekyll

      - name: Save the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Build site"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Refresh the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
