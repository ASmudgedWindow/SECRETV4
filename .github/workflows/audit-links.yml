# Checks Google Drive links in batches. Run it from the Actions tab: "Audit Drive links" -> Run workflow.
name: Audit Drive links

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First file number (first batch: 0, then 500, 1000, 1500, 2000, 2500)"
        default: "0"
      count:
        description: "How many files in this batch"
        default: "500"
      download:
        description: "Also download the files and scan what is inside? (yes / no)"
        default: "yes"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the audit
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.download }}" = "yes" ]; then EXTRA="--download downloaded"; fi
          python3 tools/audit_links.py --start "${{ inputs.start }}" --count "${{ inputs.count }}" --out audit.csv $EXTRA

      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-from-${{ inputs.start }}
          path: |
